<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Asistente</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0e1116" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Asistente" />
<link rel="apple-touch-icon" href="/icon.svg" />
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c232d; --text: #e6edf3;
    --muted: #8b949e; --accent: #5aa2ff; --user-bubble: #2b6cb0;
    --assistant-bubble: #1c232d; --border: #2a3139; --ok: #3fb950;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #ffffff; --panel-2: #f0f3f6; --text: #1f2328;
      --muted: #656d76; --accent: #2f6feb; --user-bubble: #2f6feb;
      --assistant-bubble: #eef1f4; --border: #d0d7de; --ok: #1a7f37;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  /* Altura real del viewport (dvh); no depende de la cadena de % ni de la
     barra de direcciones del móvil. */
  .app { width: 100%; max-width: 820px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; background: var(--panel); z-index: 2; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 6px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .profile { font-size: 12px; color: var(--muted); background: var(--panel-2); padding: 3px 10px; border-radius: 999px; }
  header .profile:empty { display: none; }
  .icon-btn { background: none; border: none; color: var(--text); font-size: 19px; cursor: pointer; padding: 5px 8px; border-radius: 8px; }
  .icon-btn:hover { background: var(--panel-2); }
  .icon-btn.active { color: var(--accent); }

  #drawer { position: absolute; top: 0; left: 0; bottom: 0; width: 78%; max-width: 300px; background: var(--panel); border-right: 1px solid var(--border); z-index: 5; transform: translateX(-100%); transition: transform .2s ease; display: flex; flex-direction: column; padding: 12px; }
  #drawer.open { transform: translateX(0); }
  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 4; display: none; }
  #overlay.open { display: block; }
  #newChatBtn { width: 100%; padding: 11px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; margin-bottom: 12px; }
  #chatList { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .chat-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .chat-item:hover, .chat-item.active { background: var(--panel-2); }
  .chat-item .meta { flex: 1; overflow: hidden; }
  .chat-item .t { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .p { font-size: 11px; color: var(--muted); }
  .chat-item .del { color: var(--muted); font-size: 13px; padding: 2px 6px; border-radius: 6px; }
  .chat-item .del:hover { color: #f85149; }

  .view { flex: 1; overflow-y: auto; }
  /* Ocultar de verdad: los selectores de ID (#messages{display:flex}) ganan a
     .view[hidden], así que hace falta ocultar también a nivel de ID. */
  #home[hidden], #messages[hidden] { display: none; }

  /* Home */
  #home { padding: 16px 14px 24px; }
  .brief { background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%); color: #fff; border-radius: 16px; padding: 16px 18px; font-size: 16px; line-height: 1.5; margin-bottom: 16px; min-height: 58px; }
  .brief .loading { opacity: .8; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .card h2 .count { background: var(--panel-2); color: var(--text); border-radius: 999px; padding: 1px 8px; font-size: 12px; letter-spacing: 0; }
  .row { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; font-size: 15px; }
  .row .when { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 14px; min-width: 48px; }
  .row .tag { color: var(--muted); font-size: 12px; background: var(--panel-2); padding: 1px 7px; border-radius: 999px; }
  .row .num { color: var(--muted); font-size: 12px; min-width: 22px; }
  .empty { color: var(--muted); font-size: 14px; padding: 2px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
  .chip b { color: var(--accent); font-weight: 600; }

  /* Chat */
  #messages { padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .bubble strong { font-weight: 700; }
  .bubble code { background: rgba(128,128,128,0.18); padding: 1px 5px; border-radius: 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; }
  .bubble.pending::after { content: "▋"; color: var(--muted); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 40px auto; padding: 0 20px; }

  footer { padding: 10px 12px; border-top: 1px solid var(--border); background: var(--panel); }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; max-height: 140px; padding: 11px 14px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; font: inherit; font-size: 15px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .send { background: var(--accent); color: #fff; border: none; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; font-size: 18px; display: grid; place-items: center; flex-shrink: 0; }
  .send:disabled { opacity: 0.5; }

  #picker { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 6; display: none; align-items: center; justify-content: center; padding: 24px; }
  #picker.open { display: flex; }
  .picker-box { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; width: 100%; max-width: 340px; }
  .picker-box h2 { font-size: 15px; margin: 0 0 12px; }
  .picker-box button { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; cursor: pointer; }
  .picker-box button:hover { border-color: var(--accent); }
  .picker-cancel { text-align: center !important; color: var(--muted) !important; background: none !important; border: none !important; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <button class="icon-btn" id="menuBtn" title="Chats">☰</button>
      <button class="icon-btn" id="homeBtn" title="Inicio">🏠</button>
      <h1 id="title">Inicio</h1>
      <span class="profile" id="profileTag"></span>
    </header>

    <div id="overlay"></div>
    <aside id="drawer">
      <button id="newChatBtn">＋ Nuevo chat</button>
      <div id="chatList"></div>
    </aside>

    <div id="home" class="view">
      <div class="brief" id="brief"><span class="loading">Preparando tu resumen…</span></div>
      <div id="cards"></div>
    </div>

    <div id="messages" class="view" hidden></div>

    <footer>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Pregúntame algo…" autofocus></textarea>
        <button type="submit" class="send" id="send" title="Enviar">➤</button>
      </form>
    </footer>

    <div id="picker">
      <div class="picker-box">
        <h2>¿Con qué perfil?</h2>
        <div id="pickerList"></div>
        <button class="picker-cancel" id="pickerCancel">Cancelar</button>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const homeView = $("home"), messagesEl = $("messages"), titleEl = $("title"), profileTagEl = $("profileTag");
  const drawer = $("drawer"), overlay = $("overlay"), chatListEl = $("chatList");
  const picker = $("picker"), pickerList = $("pickerList");
  const input = $("input"), sendBtn = $("send");

  const state = { view: "home", chats: [], profiles: [], currentId: null, messages: {} };

  // --- markdown seguro --------------------------------------------------------
  function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function renderMarkdown(text) {
    let h = escapeHtml(text);
    h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, "$1<em>$2</em>");
    return h;
  }

  // --- API con token ----------------------------------------------------------
  function authHeaders() { const t = localStorage.getItem("token"); return t ? { Authorization: "Bearer " + t } : {}; }
  async function api(path, opts = {}) {
    const build = () => ({ ...opts, headers: { "Content-Type": "application/json", ...authHeaders(), ...(opts.headers || {}) } });
    let res = await fetch(path, build());
    if (res.status === 401) {
      const t = prompt("Introduce el token de acceso del asistente:");
      if (t) { localStorage.setItem("token", t); res = await fetch(path, build()); }
    }
    return res;
  }
  async function getJSON(path) { try { const r = await api(path); return r.ok ? await r.json() : null; } catch (_) { return null; } }

  // --- cambio de vista --------------------------------------------------------
  function showHome() {
    state.view = "home";
    homeView.hidden = false; messagesEl.hidden = true;
    titleEl.textContent = "Inicio"; profileTagEl.textContent = "";
    $("homeBtn").classList.add("active");
    loadHome();
  }
  function showChat() {
    state.view = "chat";
    homeView.hidden = true; messagesEl.hidden = false;
    $("homeBtn").classList.remove("active");
    renderMessages(); updateHeader();
  }

  // --- HOME -------------------------------------------------------------------
  const WEEKDAYS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  function todayName() { return WEEKDAYS[new Date().getDay()]; }

  async function loadHome() {
    renderBrief();
    const [sch, items, rev, notes, mem] = await Promise.all([
      getJSON("/api/v1/schedule?when=today"),
      getJSON("/api/v1/items"),
      getJSON("/api/v1/review"),
      getJSON("/api/v1/notes"),
      getJSON("/api/v1/memory"),
    ]);
    const cards = $("cards");
    cards.innerHTML = "";
    cards.appendChild(scheduleCard(sch && sch.events || []));
    cards.appendChild(tasksCard(items && items.items || []));
    cards.appendChild(reviewCard(rev && rev.due || []));
    cards.appendChild(notesCard(notes && notes.notes || []));
    cards.appendChild(memoryCard(mem && mem.facts || {}));
  }

  async function renderBrief() {
    const el = $("brief");
    el.innerHTML = '<span class="loading">Preparando tu resumen…</span>';
    const data = await getJSON("/api/v1/brief");
    el.innerHTML = data ? renderMarkdown(data.brief) : "¡Hola! ¿En qué te ayudo hoy?";
  }

  function card(title, count, bodyEl) {
    const c = document.createElement("div");
    c.className = "card";
    const h = document.createElement("h2");
    h.textContent = title;
    if (count != null) { const b = document.createElement("span"); b.className = "count"; b.textContent = count; h.appendChild(b); }
    c.appendChild(h); c.appendChild(bodyEl);
    return c;
  }
  function rows(list, render, emptyText) {
    const box = document.createElement("div");
    if (!list.length) { box.innerHTML = `<div class="empty">${emptyText}</div>`; return box; }
    list.forEach((x) => box.appendChild(render(x)));
    return box;
  }
  function row(html) { const d = document.createElement("div"); d.className = "row"; d.innerHTML = html; return d; }

  function scheduleCard(events) {
    return card("Hoy en tu agenda", events.length || null, rows(events,
      (e) => {
        const when = e.end ? `${e.start}–${e.end}` : e.start;
        const tag = e.kind === "weekly" ? '<span class="tag">semanal</span>' : "";
        return row(`<span class="when">${escapeHtml(when)}</span><span>${escapeHtml(e.title)}</span>${tag}`);
      },
      "Nada en tu agenda para hoy."));
  }
  function tasksCard(items) {
    const pending = items.filter((i) => !i.done);
    return card("Tareas pendientes", pending.length || null, rows(pending,
      (i) => row(`<span>${escapeHtml(i.text)}</span><span class="tag">${escapeHtml(i.list)}</span>`),
      "Sin tareas pendientes. 🎉"));
  }
  function reviewCard(due) {
    return card("Para repasar hoy", due.length || null, rows(due,
      (r) => row(`<span>${escapeHtml(r.text)}</span><span class="tag">${escapeHtml(r.subject)}</span>`),
      "Nada que repasar hoy."));
  }
  function notesCard(notes) {
    const box = document.createElement("div");
    if (!notes.length) { box.innerHTML = '<div class="empty">No hay notas.</div>'; }
    else {
      const chips = document.createElement("div"); chips.className = "chips";
      notes.forEach((n) => { const s = document.createElement("span"); s.className = "chip"; s.textContent = n; chips.appendChild(s); });
      box.appendChild(chips);
    }
    return card("Notas", notes.length || null, box);
  }
  function memoryCard(facts) {
    const keys = Object.keys(facts);
    return card("Te recuerdo", keys.length || null, rows(keys,
      (k) => row(`<span class="tag">${escapeHtml(k)}</span><span>${escapeHtml(facts[k])}</span>`),
      "Aún no recuerdo nada tuyo."));
  }

  // --- CHAT (multi) -----------------------------------------------------------
  function current() { return state.chats.find((c) => c.id === state.currentId); }
  function autoscroll() { messagesEl.scrollTop = messagesEl.scrollHeight; }
  function renderBubble(msg) {
    const wrap = document.createElement("div"); wrap.className = "msg " + msg.role;
    const bubble = document.createElement("div"); bubble.className = "bubble";
    bubble.innerHTML = msg.role === "user" ? escapeHtml(msg.raw) : renderMarkdown(msg.raw);
    wrap.appendChild(bubble); messagesEl.appendChild(wrap); autoscroll();
    return bubble;
  }
  function renderMessages() {
    messagesEl.innerHTML = "";
    const msgs = state.messages[state.currentId] || [];
    if (!msgs.length) { messagesEl.innerHTML = '<div class="hint">Escribe un mensaje…</div>'; return; }
    msgs.forEach(renderBubble);
  }
  function updateHeader() {
    if (state.view !== "chat") return;
    const c = current();
    titleEl.textContent = c ? c.title : "Asistente";
    profileTagEl.textContent = c ? c.profile : "";
  }
  function renderChatList() {
    chatListEl.innerHTML = "";
    state.chats.forEach((c) => {
      const item = document.createElement("div");
      item.className = "chat-item" + (c.id === state.currentId && state.view === "chat" ? " active" : "");
      item.innerHTML = `<div class="meta"><div class="t"></div><div class="p"></div></div>`;
      item.querySelector(".t").textContent = c.title;
      item.querySelector(".p").textContent = c.profile + (c.is_default ? " · principal" : "");
      item.addEventListener("click", () => switchChat(c.id));
      if (!c.is_default) {
        const del = document.createElement("span"); del.className = "del"; del.textContent = "✕"; del.title = "Cerrar chat";
        del.addEventListener("click", (e) => { e.stopPropagation(); deleteChat(c.id); });
        item.appendChild(del);
      }
      chatListEl.appendChild(item);
    });
  }
  function openDrawer() { drawer.classList.add("open"); overlay.classList.add("open"); }
  function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }

  async function loadProfiles() { const d = await getJSON("/api/v1/profiles"); if (d) state.profiles = d.profiles; }
  async function loadChats() {
    const d = await getJSON("/api/v1/chats");
    if (!d) return;
    state.chats = d.chats;
    state.chats.forEach((c) => { if (!state.messages[c.id]) state.messages[c.id] = []; });
    if (!current()) { const def = state.chats.find((c) => c.is_default) || state.chats[0]; state.currentId = def ? def.id : null; }
    renderChatList(); updateHeader();
  }
  function switchChat(id) { state.currentId = id; closeDrawer(); showChat(); renderChatList(); }
  async function createChat(profile) {
    const r = await api("/api/v1/chats", { method: "POST", body: JSON.stringify({ profile }) });
    if (!r.ok) { alert("No se pudo crear el chat."); return; }
    const chat = await r.json(); state.messages[chat.id] = [];
    await loadChats(); switchChat(chat.id);
  }
  async function deleteChat(id) {
    const r = await api("/api/v1/chats/" + id, { method: "DELETE" });
    if (!r.ok) return;
    delete state.messages[id];
    if (state.currentId === id) state.currentId = null;
    await loadChats(); if (state.view === "chat") renderMessages();
  }
  function showPicker() {
    pickerList.innerHTML = "";
    (state.profiles.length ? state.profiles : ["system"]).forEach((p) => {
      const b = document.createElement("button"); b.textContent = p;
      b.addEventListener("click", () => { picker.classList.remove("open"); createChat(p); });
      pickerList.appendChild(b);
    });
    picker.classList.add("open");
  }

  async function send(text) {
    if (state.view !== "chat") { if (!state.currentId) await loadChats(); showChat(); }
    if (!state.currentId) return;
    const arr = state.messages[state.currentId];
    arr.push({ role: "user", raw: text }); renderBubble({ role: "user", raw: text });
    const aMsg = { role: "assistant", raw: "" }; arr.push(aMsg);
    const bubble = renderBubble(aMsg); bubble.classList.add("pending");
    try {
      const res = await api("/api/v1/chats/" + state.currentId + "/message", { method: "POST", body: JSON.stringify({ message: text }) });
      if (!res.ok) { aMsg.raw = res.status === 401 ? "⚠️ Token no válido." : "⚠️ Error del servidor."; bubble.innerHTML = renderMarkdown(aMsg.raw); return; }
      const reader = res.body.getReader(); const decoder = new TextDecoder(); let buffer = "";
      while (true) {
        const { done, value } = await reader.read(); if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n\n")) >= 0) {
          const frame = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
          const line = frame.split("\n").find((l) => l.startsWith("data:"));
          if (!line) continue;
          let data; try { data = JSON.parse(line.slice(5).trim()); } catch (_) { continue; }
          if (data.chunk) { aMsg.raw += data.chunk; bubble.innerHTML = renderMarkdown(aMsg.raw); autoscroll(); }
          else if (data.error) { aMsg.raw += "\n⚠️ " + data.error; bubble.innerHTML = renderMarkdown(aMsg.raw); }
        }
      }
    } catch (e) { aMsg.raw += "⚠️ No se pudo conectar con el asistente."; bubble.innerHTML = renderMarkdown(aMsg.raw); }
    finally { bubble.classList.remove("pending"); loadChats(); }
  }

  // --- eventos ----------------------------------------------------------------
  $("menuBtn").addEventListener("click", openDrawer);
  $("homeBtn").addEventListener("click", () => { closeDrawer(); showHome(); });
  overlay.addEventListener("click", closeDrawer);
  $("newChatBtn").addEventListener("click", () => { closeDrawer(); showPicker(); });
  $("pickerCancel").addEventListener("click", () => picker.classList.remove("open"));
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim(); if (!text) return;
    input.value = ""; input.style.height = "auto"; sendBtn.disabled = true;
    send(text).finally(() => { sendBtn.disabled = false; input.focus(); });
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

  (async function init() { await loadProfiles(); await loadChats(); showHome(); })();
</script>
</body>
</html>
